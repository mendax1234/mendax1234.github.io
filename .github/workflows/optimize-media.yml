name: Optimize website media

on:
  push:
    paths:
      - "images/education/**/*.jpg"
      - "images/education/**/*.jpeg"
      - "images/education/**/*.png"
      - "images/education/**/*.gif"
      - "images/portfolio/**/*.jpg"
      - "images/portfolio/**/*.jpeg"
      - "images/portfolio/**/*.png"
      - "images/portfolio/**/*.gif"
      - "images/posts/**/*.jpg"
      - "images/posts/**/*.jpeg"
      - "images/posts/**/*.png"
      - "images/posts/**/*.gif"
      - "images/publication/**/*.jpg"
      - "images/publication/**/*.jpeg"
      - "images/publication/**/*.png"
      - "images/publication/**/*.gif"
      - "_posts/**/*.md"
      - "_pages/**/*.md"
      - "_data/publications.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install media tools
        run: python -m pip install -r scripts/requirements.txt

      - name: Optimize media and update references
        run: python scripts/optimize_media.py --update-references

      - name: Commit optimized media
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images _posts _portfolio _pages _includes _data _layouts
          git commit -m "Optimize website media"
          git push
